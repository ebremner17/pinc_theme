players_1_column:
  label: 'One column'
  category: 'Players layouts'
  template: layouts/layout--players-1-col
  default_region: first
  regions:
    first:
      label: One
  icon_map:
    - [first]
players_2_column:
  label: 'Two columns'
  category: 'Players layouts'
  class: '\Drupal\players_cfg\Plugin\Layout\PlayersColumnLayoutBase'
  template: layouts/layout--players-2-col
  default_region: first
  regions:
    first:
      label: First
    second:
      label: Second
  icon_map:
    - [first, second]
  column_options:
    columns:
      even-split: 'Even split (50%, 50%)'
      larger-left: 'Larger left (67%, 33%)'
      larger-right: 'Larger right (33%, 67%)'
    default: 'even-split'
